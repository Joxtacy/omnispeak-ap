name: "CI: Build (Cross-compilers)"

on: [push, pull_request]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v1
    - name: Dependencies
      run: |
        sudo apt update
        sudo apt install gcc-multilib-powerpc64-linux-gnu g++-multilib-powerpc64-linux-gnu linux-libc-dev-ppc64-cross
    - name: Build (ppc64 gcc)
      working-directory: ./src
      run: |
        # NO_SSL=1: this is a compile-test only; ppc64 cross OpenSSL isn't
        # available in the apt cross packages, and the produced binary
        # isn't shipped anywhere.
        # BUILDASCPP=1: ap_client.cpp is C++ so the link step needs g++
        # (libstdc++ / __gxx_personality_v0). The pre-AP build used
        # BUILDASCPP=0 because the engine was pure C; that no longer holds.
        make BINPREFIX=powerpc64-linux-gnu- STATIC=1 BUILDASCPP=1 RENDERER=null NO_SSL=1
