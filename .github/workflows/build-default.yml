name: "CI: Build (Default)"

on: [push, pull_request]

# Cross OpenSSL + zlib for the mingw Windows builds are built from source
# here. Ubuntu's mingw-w64 packages don't ship either, and apclient/wswrap
# needs OpenSSL for wss:// and zlib for permessage-deflate. Bumping either
# version invalidates the cache below.
env:
  OPENSSL_VERSION: "3.0.15"
  ZLIB_VERSION: "1.3.1"

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v1
    - name: Dependencies
      run: |
        sudo apt update
        sudo apt install libsdl2-dev libssl-dev zlib1g-dev mingw-w64 libasound2-dev libieee1284-3-dev
    - name: Cache mingw OpenSSL + zlib
      id: openssl-cache
      uses: actions/cache@v4
      with:
        path: openssl-mingw
        key: openssl-mingw-${{ env.OPENSSL_VERSION }}-zlib-${{ env.ZLIB_VERSION }}-v2
    - name: Build mingw OpenSSL + zlib
      if: steps.openssl-cache.outputs.cache-hit != 'true'
      run: |
        set -euo pipefail
        # GitHub releases / zlib fossils — stable URLs that don't 404 once
        # newer point releases ship.
        wget -q "https://github.com/openssl/openssl/releases/download/openssl-${OPENSSL_VERSION}/openssl-${OPENSSL_VERSION}.tar.gz"
        wget -q "https://zlib.net/fossils/zlib-${ZLIB_VERSION}.tar.gz"
        tar xf openssl-${OPENSSL_VERSION}.tar.gz
        tar xf zlib-${ZLIB_VERSION}.tar.gz
        for arch in mingw mingw64; do
          case "$arch" in
            mingw)   tool=i686-w64-mingw32   ; out="$GITHUB_WORKSPACE/openssl-mingw/i686"   ;;
            mingw64) tool=x86_64-w64-mingw32 ; out="$GITHUB_WORKSPACE/openssl-mingw/x86_64" ;;
          esac
          # zlib first — OpenSSL doesn't need it for our usage, but the
          # Windows mingw build links both for the apclient/wswrap stack.
          (cd zlib-${ZLIB_VERSION} && \
            make -f win32/Makefile.gcc clean && \
            make -f win32/Makefile.gcc PREFIX="${tool}-" -j$(nproc) && \
            make -f win32/Makefile.gcc PREFIX="${tool}-" install \
              DESTDIR="$out" INCLUDE_PATH=/include LIBRARY_PATH=/lib BINARY_PATH=/bin)
          # --libdir=lib: OpenSSL defaults to lib64 on 64-bit targets,
          # which doesn't match the -L paths we pass to make. Pin to lib
          # so both i686 and x86_64 install layouts are identical.
          (cd openssl-${OPENSSL_VERSION} && \
            ./Configure "$arch" --cross-compile-prefix="${tool}-" --prefix="$out" --libdir=lib no-shared no-tests && \
            make -j$(nproc) && make install_sw && make distclean)
        done
    - name: Build (Linux)
      working-directory: ./src
      run: |
        make WITH_ALSA=1 WITH_IEEE1284=1
    - name: Build (Windows)
      working-directory: ./src
      run: |
        # CXXFLAGS / LDFLAGS via env (not `make VAR=val`) so the Makefile's
        # own `+=` additions still apply — command-line vars override `+=`,
        # env vars don't.
        export CXXFLAGS="-I$GITHUB_WORKSPACE/openssl-mingw/i686/include"
        export LDFLAGS="-L$GITHUB_WORKSPACE/openssl-mingw/i686/lib"
        make PLATFORM=win32
        export CXXFLAGS="-I$GITHUB_WORKSPACE/openssl-mingw/x86_64/include"
        export LDFLAGS="-L$GITHUB_WORKSPACE/openssl-mingw/x86_64/lib"
        make PLATFORM=win64
    - name: Upload (Linux)
      uses: actions/upload-artifact@v4
      with:
        name: Linux Build
        path: bin/
    - name: Upload (Windows)
      uses: actions/upload-artifact@v4
      with:
        name: Windows Build
        path: bin-win*/
